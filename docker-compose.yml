services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bdo_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USE_SQLITE: "False"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./.env:/app/.env



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bdo_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:

